[advisories]
ignore = [
    "RUSTSEC-2026-0204",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134"
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSD-3-Clause-Clear"
]
confidence-threshold = 0.8
exceptions = [
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[[licenses.clarify]]
name = "arkhe-haselgrove"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "cathedral-agents"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "cathedral-taproot-bridge"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "safe-core-fhe"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[[bans.deny]]
name = "failure"
[[bans.deny]]
name = "rustc-serialize"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
